{% extends 'layout.html' %}

{% block head %}
    <title> {{designacao}} - Detalhe </title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --fundo-creme: #FFFAF0;
            --roxo-pastel-texto: #4F378B;
            --azul-pastel-borda: #B3E5FC;
            --rosa-botao: #F48FB1;
            --rosa-botao-hover: #F06292;
            --vermelho-pastel: #FF8A80;
            --texto-geral: #5c5c5c;
        }

        body {
            background-color: var(--fundo-creme);
            color: var(--texto-geral);
            font-family: 'Nunito', sans-serif;
        }

        .cartao-termo {
            background-color: white;
            border: 3px solid var(--azul-pastel-borda);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            margin-top: 20px;
        }

        .titulo-termo {
            color: var(--roxo-pastel-texto);
            font-weight: 800;
            font-size: 2.5rem;
            border-bottom: 2px dashed var(--azul-pastel-borda);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .descricao-termo {
            font-size: 1.25rem;
            line-height: 1.8;
            color: var(--texto-geral);
        }

        /* Botões */
        .btn-voltar {
            background-color: var(--rosa-botao);
            color: white !important;
            border-radius: 20px;
            font-weight: 800;
            padding: 10px 25px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            border: none;
        }
        
        .btn-voltar:hover {
            background-color: var(--rosa-botao-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(240, 98, 146, 0.3);
        }

        /* Botão apagar restaurado */
        .btn-apagar {
            background-color: white;
            color: var(--vermelho-pastel);
            border: 2px solid var(--vermelho-pastel);
            border-radius: 20px;
            font-weight: 800;
            padding: 8px 20px;
            transition: all 0.3s ease;
        }

        .btn-apagar:hover {
            background-color: var(--vermelho-pastel);
            color: white;
            transform: translateY(-3px);
        }
    </style>
{% endblock %}

{% block body %}
    <div class="container my-5" style="max-width: 800px;">
        
        <div class="d-flex justify-content-between align-items-center">
            <a href="/conceitos" class="btn-voltar shadow-sm">&larr; Voltar à Lista</a>
            
            <button type="button" class="btn-apagar shadow-sm" onclick="apagar_conceito('{{designacao}}')">
                Apagar Conceito
            </button>
        </div>

        <div class="cartao-termo">
            <h1 class="titulo-termo">{{designacao}}</h1>
            <p class="descricao-termo">{{descricao}}</p>
        </div>

    </div>
{% endblock %}
