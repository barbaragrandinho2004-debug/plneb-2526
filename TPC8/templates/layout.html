<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.datatables.net/2.3.7/css/dataTables.dataTables.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
        
        <style>
            .navbar-pastel {
                background-color: #EADDFF !important; /* Roxo pastel do teu tema */
                border-bottom: 3px solid #B3E5FC;
            }
            .navbar-pastel .nav-link {
                color: #4F378B !important;
                font-weight: 800;
                transition: all 0.3s ease;
                margin: 0 5px;
                border-radius: 15px;
            }
            .navbar-pastel .nav-link:hover {
                background-color: white;
                color: #D81B60 !important; /* Rosa pastel */
                transform: translateY(-2px);
            }
            .navbar-brand {
                color: #4F378B !important;
                font-weight: 900;
                font-size: 1.5rem;
            }
        </style>
        
        {% block head %}
        {% endblock %}
    </head>
    
    <body style="background-color: #FFFAF0; font-family: 'Nunito', sans-serif;">
        <nav class="navbar navbar-expand-lg navbar-light navbar-pastel shadow-sm mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">MedDic ⚕️</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="navbar-nav ms-auto"> 
                        <a class="nav-link px-3" href="/">Home</a>
                        <a class="nav-link px-3" href="/conceitos">Conceitos</a>
                        <a class="nav-link px-3" href="/tabela">Tabela</a>
                        <a class="nav-link px-3" href="/pesquisar">Pesquisar</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container"> 
            {% block body %}
            {% endblock %}
        </div>
        
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.datatables.net/2.3.7/js/dataTables.js"></script>
        <script src="/static/script/script.js"></script>
    </body>
</html>
